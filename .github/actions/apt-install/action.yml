name: Install apt packages
description: >
  apt-get install with the downloaded .deb files cached between runs, and each
  attempt bounded and retried. The hosted runners' Ubuntu mirror sometimes
  slows to a crawl mid-download; without this, one stalled package used the
  whole job's timeout before any of our code ran.

inputs:
  packages:
    description: Space-separated apt package names.
    required: true

runs:
  using: composite
  steps:
    - name: Compute apt cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        hash=$(printf '%s\n' $PACKAGES | sort -u | sha256sum | cut -c1-16)
        # ImageVersion changes when GitHub rebuilds the image (about weekly);
        # the prefix restore below still reuses whatever .debs are unchanged.
        echo "prefix=apt-${ImageOS}-${hash}-" >> "$GITHUB_OUTPUT"
        echo "key=apt-${ImageOS}-${hash}-${ImageVersion}" >> "$GITHUB_OUTPUT"
        echo "dir=${RUNNER_TEMP}/apt-archives" >> "$GITHUB_OUTPUT"

    - name: Restore cached .deb files
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: apt-get install
      id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ARCHIVES: ${{ steps.key.outputs.dir }}
      run: |
        sudo mkdir -p "$ARCHIVES/partial"
        opts=(
          -o "Dir::Cache::Archives=$ARCHIVES"
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        )
        # Each attempt is bounded, so a stalled download restarts instead of
        # running out the job clock. Already-downloaded .debs are kept.
        for attempt in 1 2 3; do
          if sudo timeout 180 apt-get "${opts[@]}" update -q \
            && sudo timeout 300 apt-get "${opts[@]}" install -y -q $PACKAGES; then
            exit 0
          fi
          echo "::warning::apt attempt $attempt failed or timed out; retrying"
          # A timeout can interrupt dpkg; finish any half-configured packages.
          sudo dpkg --configure -a || true
          # The runner's default Azure mirror is the one that stalls; retry
          # against the main Ubuntu archive instead.
          sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sleep 5
        done
        echo "::error::apt-get install failed after 3 attempts"
        exit 1

    # Runs even when the install failed or the job timed out, so the .debs
    # that did arrive are kept for the next run.
    - name: Prepare .deb files for caching
      if: always() && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        ARCHIVES: ${{ steps.key.outputs.dir }}
      run: |
        sudo rm -rf "$ARCHIVES/partial" "$ARCHIVES/lock"
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"

    # A complete download is saved under the exact key. An incomplete one is
    # saved under a run-specific key that only the prefix restore matches, so
    # the next run resumes from it and then saves the complete set.
    - name: Save .deb files
      if: always() && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.install.outcome == 'success' && steps.key.outputs.key || format('{0}partial-{1}-{2}', steps.key.outputs.prefix, github.run_id, github.run_attempt) }}
