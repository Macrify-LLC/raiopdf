name: Install apt packages
description: >
  apt-get install with the downloaded .deb files cached between runs, and each
  attempt bounded and retried. The hosted runners' Ubuntu mirror sometimes
  slows to a crawl mid-download; without this, one stalled package used the
  whole job's timeout before any of our code ran.

inputs:
  packages:
    description: Space-separated apt package names. Give this or `command`.
    required: false
    default: ""
  command:
    description: >
      A command that installs packages through apt itself (for example
      `playwright install-deps`), run instead of installing `packages`. apt is
      configured machine-wide, so it still gets the cache, timeouts and retries.
    required: false
    default: ""
  cache-salt:
    description: Extra cache-key input, such as a lockfile hash for `command`.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Compute apt cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        COMMAND: ${{ inputs.command }}
        SALT: ${{ inputs.cache-salt }}
      run: |
        if [ -z "$PACKAGES" ] && [ -z "$COMMAND" ]; then
          echo "::error::apt-install needs packages or command"; exit 1
        fi
        hash=$( { printf '%s\n' $PACKAGES | sort -u; printf '%s\n' "$COMMAND" "$SALT"; } | sha256sum | cut -c1-16)
        # ImageVersion changes when GitHub rebuilds the image (about weekly);
        # the prefix restore below still reuses whatever .debs are unchanged.
        {
          echo "prefix=apt-${ImageOS}-${hash}-"
          echo "key=apt-${ImageOS}-${hash}-${ImageVersion}"
          echo "dir=${RUNNER_TEMP}/apt-archives"
        } >> "$GITHUB_OUTPUT"

    - name: Restore cached .deb files
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: apt-get install
      id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        COMMAND: ${{ inputs.command }}
        ARCHIVES: ${{ steps.key.outputs.dir }}
      run: |
        sudo mkdir -p "$ARCHIVES/partial"
        # Machine-wide, so apt calls made by `command` pick it up too.
        sudo tee /etc/apt/apt.conf.d/99ci-apt-install >/dev/null <<EOF
        Dir::Cache::Archives "$ARCHIVES";
        Acquire::Retries "3";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        EOF
        # Each attempt is bounded, so a stalled download restarts instead of
        # running out the job clock. Already-downloaded .debs are kept.
        for attempt in 1 2 3; do
          if [ "$attempt" = 1 ]; then echo "TEMP: forcing attempt 1 to fail"; echo "== mirrors before"; cat /etc/apt/apt-mirrors.txt || true; else
          if [ -n "$COMMAND" ]; then
            timeout 480 bash -c "$COMMAND" && exit 0
          elif sudo timeout 180 apt-get update -q \
            && sudo timeout 300 apt-get install -y -q $PACKAGES; then
            exit 0
          fi
          fi
          echo "::warning::apt attempt $attempt failed or timed out; retrying"
          # A timeout can interrupt dpkg; finish any half-configured packages.
          sudo dpkg --configure -a || true
          # The runner's default Azure mirror is the one that stalls. Its apt
          # sources read a mirror list; drop Azure from it (keeping the other
          # entries), and from any plain source line.
          list=/etc/apt/apt-mirrors.txt
          if [ -f "$list" ] && grep -v 'azure\.archive\.ubuntu\.com' "$list" | grep -q .; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' "$list"
          fi
          sudo sed -i 's#http://azure\.archive\.ubuntu\.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
            /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          echo "== mirrors after"; cat /etc/apt/apt-mirrors.txt || true
          sleep 5
        done
        echo "::error::apt-get install failed after 3 attempts"
        exit 1

    # Runs even when the install failed or the job timed out, so the .debs
    # that did arrive are kept for the next run.
    - name: Prepare .deb files for caching
      id: prepare
      if: always()
      shell: bash
      env:
        ARCHIVES: ${{ steps.key.outputs.dir }}
      run: |
        sudo rm -f /etc/apt/apt.conf.d/99ci-apt-install
        sudo rm -rf "$ARCHIVES/partial" "$ARCHIVES/lock"
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
        # Don't save an empty archive: the newest prefix match wins a restore,
        # so it would hide an older, complete one.
        if compgen -G "$ARCHIVES/*.deb" >/dev/null; then
          echo "has-debs=true" >> "$GITHUB_OUTPUT"
        fi

    # A complete download is saved under the exact key. An incomplete one is
    # saved under a run-specific key that only the prefix restore matches, so
    # the next run resumes from it and then saves the complete set.
    - name: Save .deb files
      if: always() && steps.restore.outputs.cache-hit != 'true' && steps.prepare.outputs.has-debs == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ steps.install.outcome == 'success' && steps.key.outputs.key || format('{0}partial-{1}-{2}', steps.key.outputs.prefix, github.run_id, github.run_attempt) }}
