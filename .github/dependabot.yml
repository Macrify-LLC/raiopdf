version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # react-dom pins an exact peer range on react (`react: ^19.2.8`), so a PR
      # that bumps only one half leaves the pair mismatched and CI red. Keep
      # them — and their types — in a single PR.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # The WebdriverIO packages in apps/shell/e2e move together, and
      # @wdio/tauri-service depends on an exact @wdio/types 9.x. A PR that
      # bumps one of them alone (#389: @wdio/types to 10) leaves the set
      # mismatched in a path PR CI never runs.
      wdio:
        patterns:
          - webdriverio
          - "@wdio/*"
    ignore:
      # Hold the next WebdriverIO major until @wdio/tauri-service supports it.
      - dependency-name: webdriverio
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wdio/*"
        update-types: ["version-update:semver-major"]
      # The types track the Node runtime (24: .nvmrc, engines, CI). A newer
      # major would let the type checker accept APIs Node 24 doesn't have.
      # Raise this together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /apps/shell/src-tauri
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    # The composite action under .github/actions pins actions/cache too.
    directories:
      - /
      - /.github/actions/apt-install
    schedule:
      interval: weekly
